name: Application checks

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Check types
        run: npm run typecheck
      - name: Check preview access
        run: npm test
      - name: Build for production
        run: npm run build
      - name: Check production server
        run: npm run test:smoke
      - name: Package preview source
        run: tar --exclude=.git --exclude=node_modules -czf preview-source.tgz .
      - name: Upload preview source
        uses: actions/upload-artifact@v4
        with:
          name: bank-reconciliation-preview-source
          path: preview-source.tgz
          retention-days: 1
